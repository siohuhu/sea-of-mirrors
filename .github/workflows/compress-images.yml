name: Compress Images

on:
  push:
    branches:
      - main
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install imagemin
        run: |
          npm install -g imagemin-cli imagemin-mozjpeg imagemin-pngquant

      - name: Compress JPG
        run: |
          find . -name "*.jpg" -o -name "*.jpeg" | grep -v node_modules | grep -v .git | while read f; do
            imagemin "$f" --plugin=mozjpeg --out-dir="$(dirname $f)"
          done

      - name: Compress PNG
        run: |
          find . -name "*.png" | grep -v node_modules | grep -v .git | while read f; do
            imagemin "$f" --plugin=pngquant --out-dir="$(dirname $f)"
          done

      - name: Commit compressed images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: compress images"
          file_pattern: "*.jpg *.png image/*.jpg image/*.png"
